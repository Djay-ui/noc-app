<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Mail Dispatch | TeleGlobal NOC</title>
    <!-- FontAwesome & JetBrains Mono / Plus Jakarta Sans Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-body: #05070f;
            --bg-container: #0b1120;
            --bg-card: #131b2e;
            --bg-alt: #080d1a;
            --input-bg: #060a14;
            --border: #1e293b;
            --border-light: #172554;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --text-highlight: #38bdf8;
            --dropdown-bg: #131b2e;
            --dropdown-hover: #0b1120;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --btn-nav: #1e293b;
        }

        :root[data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-container: #ffffff;
            --bg-card: #f1f5f9;
            --bg-alt: #e2e8f0;
            --input-bg: #ffffff;
            --border: #cbd5e1;
            --border-light: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-highlight: #0284c7;
            --dropdown-bg: #ffffff;
            --dropdown-hover: #f1f5f9;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --btn-nav: #e2e8f0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(rgba(30, 41, 59, 0.3) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            background: var(--bg-container); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border-light);
        }

        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 24px; 
            margin-bottom: 32px; 
            gap: 20px; 
            flex-wrap: wrap; 
        }

        .header-title h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.03em;
        }

        .header-title h2 i { color: var(--text-highlight); }

        .header-title p {
            margin: 6px 0 0;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle-btn, .back-btn {
            background: var(--btn-nav);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover, .back-btn:hover {
            border-color: var(--text-highlight);
            color: var(--text-highlight);
        }

        /* --- System Cards & Lookup Section --- */
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            padding: 28px; 
            border-radius: 14px; 
            margin-bottom: 28px; 
            position: relative;
        }
        .card h3 {
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-highlight);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group.full-width { grid-column: span 2; }

        label { 
            display: block; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: var(--text-muted); 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
        }

        input, textarea { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px; 
            background-color: var(--input-bg); 
            color: var(--text-main); 
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--text-highlight);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        .row { display: flex; gap: 20px; }
        .col { flex: 1; }

        .search-btn { 
            background: #2563eb; 
            color: white; 
            border: none;
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: 800; 
            height: 48px;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: all 0.2s ease;
        }
        .search-btn:hover { background: #1d4ed8; }

        .submit-btn { 
            background: #10b981; 
            color: white; 
            border: none;
            cursor: pointer;
            border-radius: 8px; 
            font-weight: 800; 
            padding: 16px; 
            width: 100%; 
            font-size: 15px; 
            margin-top: 10px; 
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .submit-btn:hover { background: #059669; transform: translateY(-1px); }

        /* Dynamic Selection Dropdown Matching Dashboard Architecture */
        .dropdown-selection-item { 
            padding: 14px 18px; 
            cursor: pointer; 
            border-bottom: 1px solid var(--border-light); 
            font-size: 13px; 
            transition: background 0.15s ease; 
            color: var(--text-main); 
        }
        .dropdown-selection-item:last-child { border-bottom: none; }

        .status-msg { 
            padding: 16px; 
            border-radius: 8px; 
            font-weight: 700; 
            display: none; 
            font-size: 14px; 
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .row { flex-direction: column; gap: 0; }
            .form-group.col { margin-bottom: 20px; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="header-title">
            <h2><i class="fa-solid fa-paper-plane"></i> Custom Mail Dispatch</h2>
            <p>TeleGlobal NOC Dispatch Automation</p>
        </div>
        <div class="header-actions">
            <!-- Back to Dashboard Link -->
            <a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard Engine</a>

            <!-- Theme Switcher Button -->
            <button type="button" class="theme-toggle-btn" onclick="toggleDashboardTheme()">
                <i class="fa-solid fa-circle-half-stroke"></i> Theme Profile
            </button>
        </div>
    </div>

    <div id="statusBox" class="status-msg"></div>

    <!-- 1. Lookup Network Circuit Panel (Matches dashboard.html exact search engine) -->
    <div class="card" style="position: relative;">
        <h3><i class="fa-solid fa-magnifying-glass-chart"></i> 1. Lookup Network Circuit</h3>
        <div class="form-group row" style="align-items: flex-end; margin-bottom: 0;">
            <div style="flex: 3; position: relative;">
                <input type="text" id="circuit_search" placeholder="Type Target Circuit ID, Customer Identity Reference, Company Name, or Contact Phone..." autocomplete="off" style="height: 48px;">
                
                <!-- Dynamic Results Selection Dropdown -->
                <div id="circuit_selection_dropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--dropdown-bg); border: 1px solid var(--border); border-radius: 8px; max-height: 240px; overflow-y: auto; z-index: 10000; box-shadow: var(--shadow); margin-top: 6px;"></div>
            </div>
            <div style="flex: 1;">
                <button type="button" class="search-btn" onclick="lookupNetworkCircuits()"><i class="fa-solid fa-database"></i> Fetch Data</button>
            </div>
        </div>
    </div>

    <!-- 2. Custom Mail Form -->
    <form id="customMailForm">
        <div class="card">
            <h3><i class="fa-solid fa-building"></i> 2. Customer & Circuit Details</h3>
            <div class="row">
                <div class="form-group col">
                    <label for="circuit_id">Circuit ID</label>
                    <input type="text" name="circuit_id" id="circuit_id" placeholder="e.g., CKT-109283" required>
                </div>
                <div class="form-group col">
                    <label for="company_name">Customer / Company Name</label>
                    <input type="text" name="company_name" id="company_name" placeholder="e.g., Enterprise Client Pvt Ltd" required>
                </div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-envelope-open-text"></i> 3. Recipient Email Routing</h3>
            <div class="row">
                <div class="form-group col">
                    <label for="customer_email">Primary Customer Destination Email</label>
                    <input type="email" name="customer_email" id="customer_email" placeholder="client@domain.com" required>
                </div>
                <div class="form-group col">
                    <label for="cc_emails">Carbon Copy (CC) Emails</label>
                    <input type="text" name="cc_emails" id="cc_emails" placeholder="comma separated additional emails...">
                </div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-pen-to-square"></i> 4. Custom Mail Content</h3>
            <div class="form-group full-width">
                <label for="mail_subject">Email Subject</label>
                <input type="text" name="mail_subject" id="mail_subject" placeholder="Enter custom email subject line..." required>
            </div>
            <div class="form-group full-width">
                <label for="mail_context">Custom Mail Body / Message Context</label>
                <textarea name="mail_context" id="mail_context" rows="6" placeholder="Draft your professional message to the customer here..." required></textarea>
            </div>
            <div class="form-group full-width">
                <label for="attachment"><i class="fa-solid fa-paperclip"></i> Attachment (Optional)</label>
                <input type="file" name="attachment" id="attachment" style="border: none; padding-left: 0; background: transparent;">
            </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
            <i class="fa-solid fa-paper-plane"></i> Dispatch Custom Mail
        </button>
    </form>
</div>

<script>
    // --- Dynamic Theme Initialization Framework ---
    function initDashboardTheme() {
        const activeTheme = localStorage.getItem('noc-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', activeTheme);
    }

    function toggleDashboardTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('noc-theme', newTheme);
    }
    initDashboardTheme();

    function displayStatus(message, isSuccess) {
        const box = document.getElementById('statusBox');
        box.style.display = 'block';
        if (isSuccess) {
            box.style.background = 'rgba(16, 185, 129, 0.15)';
            box.style.color = '#10b981';
            box.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${message}</span>`;
        } else {
            box.style.background = 'rgba(239, 68, 68, 0.15)';
            box.style.color = '#ef4444';
            box.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>${message}</span>`;
        }
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // --- Lookup Network Circuit Engine (Identical to dashboard.html) ---
    async function lookupNetworkCircuits() {
        const inputVal = document.getElementById('circuit_search').value.trim();
        const dropdown = document.getElementById('circuit_selection_dropdown');
        
        if (!inputVal) {
            dropdown.style.display = 'none';
            alert('Please type a Circuit ID, Name, or Phone number.');
            return;
        }

        try {
            const res = await fetch(`/api/circuit/${encodeURIComponent(inputVal)}`);
            if (!res.ok) {
                dropdown.style.display = 'none';
                throw new Error('No matching target parameters recognized inside Inventory.');
            }
            
            const records = await res.json();
            
            // Single result match logic
            if (records.length === 1) {
                dropdown.style.display = 'none';
                populateFormWithCircuit(records[0]);
                displayStatus("Circuit data fetched successfully.", true);
                return;
            }

            // Multiple result matches dropdown builder logic
            dropdown.innerHTML = '';
            records.forEach((circuit) => {
                const rowItem = document.createElement('div');
                rowItem.className = 'dropdown-selection-item';
                rowItem.onmouseover = () => rowItem.style.background = 'var(--dropdown-hover)';
                rowItem.onmouseout = () => rowItem.style.background = 'transparent';
                rowItem.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold;">
                        <span style="color: var(--text-highlight); font-family: 'JetBrains Mono', monospace;">${circuit.circuit_id}</span>
                        <span style="color: var(--text-main);">${circuit.customer_name || circuit.company_name}</span>
                    </div>
                    <small style="color: var(--text-muted); display:block; margin-top:3px;">Company: ${circuit.company_name || 'N/A'} | Contact: ${circuit.phone_number || 'N/A'}</small>
                `;
                rowItem.onclick = () => {
                    populateFormWithCircuit(circuit);
                    dropdown.style.display = 'none';
                    displayStatus(`Selected circuit entry ${circuit.circuit_id}.`, true);
                };
                dropdown.appendChild(rowItem);
            });
            dropdown.style.display = 'block';
            displayStatus(`Found ${records.length} matches. Select an entry from the dropdown.`, true);
        } catch (err) {
            displayStatus(err.message, false);
        }
    }

    function populateFormWithCircuit(circuit) {
        document.getElementById('circuit_search').value = circuit.circuit_id || '';
        document.getElementById('circuit_id').value = circuit.circuit_id || '';
        document.getElementById('company_name').value = circuit.customer_name || circuit.company_name || '';
        document.getElementById('customer_email').value = circuit.customer_email || circuit.email || '';
    }

    // Trigger lookup when hitting Enter in search input
    document.getElementById('circuit_search').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            lookupNetworkCircuits();
        }
    });

    // Hide selection dropdown when clicking outside
    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('circuit_selection_dropdown');
        if (dropdown && e.target.id !== 'circuit_search') {
            dropdown.style.display = 'none';
        }
    });

    // --- Submit Custom Mail Form ---
    document.getElementById('customMailForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Dispatching Custom Mail...`;

        const formData = new FormData(this);

        try {
            const response = await fetch('/api/tools/send-custom-mail', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                displayStatus(data.message || "Custom mail delivered successfully.", true);
                this.reset();
            } else {
                displayStatus("Mailer Core Error: " + (data.detail || JSON.stringify(data)), false);
            }
        } catch (error) {
            displayStatus("NOC Connection Failure: Network error during mail server sync.", false);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Dispatch Custom Mail`;
        }
    });
</script>
</body>
</html>
