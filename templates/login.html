<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOC Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#020617;font-family:Segoe UI;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{position:fixed;inset:0}
.card{position:relative;z-index:2;width:420px;background:rgba(10,20,35,.72);backdrop-filter:blur(14px);padding:40px;border-radius:20px;border:1px solid #3b82f655;color:#fff}
h2,p{text-align:center}input{width:100%;margin:12px 0;padding:14px;border-radius:10px;border:1px solid #334155;background:#08111f;color:#fff}
button{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(90deg,#2563eb,#06b6d4);color:#fff;font-weight:bold}
</style></head><body>
<canvas id=c></canvas>
<div class=card><h2>TeleGlobal NOC Suite</h2><p>Operational Authentication Service</p>
<form action="/api/auth/login" method="POST">
<input name="username" placeholder="Username" autocomplete="username" required>
<input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
<button type="submit">Authenticate Session</button></form></div>
<script>
const x=c.getContext('2d');function r(){c.width=innerWidth;c.height=innerHeight}onresize=r;r();
let n=[...Array(55)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2}));
function a(){x.fillStyle='#020617';x.fillRect(0,0,c.width,c.height);
for(let i=0;i<n.length;i++){let p=n[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;
x.fillStyle='#38bdf8';x.beginPath();x.arc(p.x,p.y,2,0,7);x.fill();
for(let j=i+1;j<n.length;j++){let q=n[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<180){x.strokeStyle='rgba(59,130,246,'+(1-d/180)/2+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();
let t=(Date.now()/600+d)%180;if(Math.abs(t-d)<3){let k=t/d;x.fillStyle='#22c55e';x.beginPath();x.arc(p.x+(q.x-p.x)*k,p.y+(q.y-p.y)*k,3,0,7);x.fill();}}}}
requestAnimationFrame(a)}a();
setInterval(()=>{const ctx=c.getContext('2d');for(let i=0;i<30;i++){ctx.strokeStyle='rgba(34,197,94,.15)';ctx.beginPath();let y=Math.random()*c.height;ctx.moveTo(0,y);ctx.lineTo(c.width,y+Math.sin(Date.now()/500+i)*20);ctx.stroke();}},80);
</script>
<script>
const stars=[...Array(120)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*2}));
setInterval(()=>{},1000);
</script>
</body></html>
