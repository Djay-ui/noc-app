<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premises Access Request Engine | TeleGlobal NOC</title>
    <!-- FontAwesome Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-body: #090d16;
            --bg-container: #111827;
            --bg-card: #1f2937;
            --border: #374151;
            --border-light: #172554;
            --border-focus: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --text-highlight: #38bdf8;
            --accent: #10b981;
            --accent-hover: #059669;
            --input-bg: #0b0f19;
            --section-bg: rgba(31, 41, 55, 0.2);
            --lookup-bg: rgba(15, 23, 42, 0.4);
            --dropdown-bg: #131b2e;
            --dropdown-hover: #0b1120;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --btn-logs-bg: rgba(71, 85, 105, 0.4);
            --btn-primary-text: #ffffff;
        }

	.nav-link-btn { 
    background: #1d4ed8; 
    color: white; 
    padding: 10px 16px; 
    border-radius: 8px; 
    font-weight: 700; 
    font-size: 13px; 
    border: 1px solid rgba(255,255,255,0.05); 
    text-decoration: none; 
    cursor: pointer; 
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
}

.nav-link-btn:hover { 
    background: #1e40af;
    transform: translateY(-2px); 
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

        :root[data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-container: #ffffff;
            --bg-card: #f8fafc;
            --border: #cbd5e1;
            --border-light: #cbd5e1;
            --border-focus: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-highlight: #0284c7;
            --accent: #059669;
            --accent-hover: #047857;
            --input-bg: #ffffff;
            --section-bg: #f8fafc;
            --lookup-bg: #f1f5f9;
            --dropdown-bg: #ffffff;
            --dropdown-hover: #f1f5f9;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --btn-logs-bg: #e2e8f0;
            --btn-primary-text: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 40px 20px;
            margin: 0;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 950px;
            background: var(--bg-container);
            margin: 0 auto;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow);
        }

        .header-block {
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title h2 i { color: var(--accent); }

        .header-title p {
            margin: 6px 0 0;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle-btn {
            background: var(--btn-logs-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Dynamic Search & Lookup Card Styles --- */
        .lookup-card {
            background: var(--lookup-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 35px;
            position: relative;
        }

        .lookup-card label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .lookup-group { 
            display: flex; 
            gap: 12px; 
            align-items: flex-end; 
        }

        .lookup-group input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 14px 18px;
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
            height: 48px;
            box-sizing: border-box;
            width: 100%;
        }

        .dropdown-selection-item { 
            padding: 16px 20px; 
            cursor: pointer; 
            border-bottom: 1px solid var(--border-light); 
            font-size: 13px; 
            transition: background 0.15s ease; 
            color: var(--text-main); 
        }

        .form-section {
            background: var(--section-bg);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-heading i { color: var(--accent); }

        .section-heading::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .full-width { grid-column: span 2; }

        .engineer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input, .form-group textarea {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--border-focus);
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 48px;
        }

        .btn-success { background: var(--accent); color: #fff; }
        .btn-success:hover { background: var(--accent-hover); }

        .btn-primary {
            background: var(--accent);
            color: var(--btn-primary-text);
            width: 100%;
            font-size: 16px;
            padding: 16px;
            margin-top: 16px;
            font-weight: 700;
            height: auto;
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .status-banner {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .status-banner.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            display: flex;
        }
        .status-banner.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            display: flex;
        }

        @media (max-width: 768px) {
            .form-grid, .engineer-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .lookup-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<script>
    const savedTheme = localStorage.getItem('noc-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<div class="container">
    <div class="header-block">
        <div class="header-title">
            <h2><i class="fa-solid fa-key"></i> Customer Premises Access Request</h2>
            <p>TeleGlobal NOC Dispatch Automation</p>
        </div>
        <div class="header-actions">
		<a href="/" class="nav-link-btn" title="Return to Main Dashboard">
        <i class="fa-solid fa-chart-line"></i> Dashboard
    </a>
            <button type="button" id="themeToggle" class="theme-toggle-btn" title="Toggle System Visual Profile">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
    </div>

    <div id="statusAlert" class="status-banner"></div>
    
    <!-- Dynamic Network Circuit Lookup Deck -->
    <div class="lookup-card">
        <label for="circuit_search">Automated Inventory Core Lookup</label>
        <div class="lookup-group">
            <div style="flex: 3; position: relative;">
                <input type="text" id="circuit_search" placeholder="Type Target Circuit ID, Customer Identity Reference, Company Name, or Contact Phone..." autocomplete="off">
                <div id="circuit_selection_dropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--dropdown-bg); border: 1px solid var(--border); border-radius: 8px; max-height: 240px; overflow-y: auto; z-index: 10000; box-shadow: var(--shadow); margin-top: 6px;"></div>
            </div>
            <div style="flex: 1;">
                <button type="button" id="searchBtn" onclick="lookupNetworkCircuits()" class="btn btn-success" style="width: 100%;">
                    <i class="fa-solid fa-magnifying-glass"></i> Search Inventory
                </button>
            </div>
        </div>
    </div>

    <form id="accessMailForm">
        <div class="form-section">
            <div class="section-heading"><i class="fa-solid fa-building"></i> Customer & Site Details</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="company_name">Customer / Company Name</label>
                    <input type="text" name="company_name" id="company_name" placeholder="e.g., Enterprise Client Pvt Ltd" required>
                </div>
                <div class="form-group">
                    <label for="access_date">Planned Visit Date / Window</label>
                    <input type="text" name="access_date" id="access_date" placeholder="e.g., 22nd July 2026 at 11:00 AM" required>
                </div>
                <div class="form-group">
                    <label for="site_location">Site Address / Location</label>
                    <input type="text" name="site_location" id="site_location" placeholder="e.g., Server Room, 3rd Floor, Building B" required>
                </div>
                <div class="form-group">
                    <label for="expected_duration">Expected Duration</label>
                    <input type="text" name="expected_duration" id="expected_duration" placeholder="e.g., 2 Hours" required>
                </div>
                <div class="form-group full-width">
                    <label for="purpose">Scope & Purpose of Visit</label>
                    <textarea name="purpose" id="purpose" rows="2" placeholder="e.g., Scheduled backup fiber maintenance and link commissioning." required></textarea>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-heading"><i class="fa-solid fa-users"></i> Visiting Engineers Roster</div>
            
            <!-- Engineer 1 -->
            <label style="font-size:12px; font-weight:700; color:var(--accent);">PRIMARY ENGINEER</label>
            <div class="engineer-grid">
                <input type="text" name="engineer_name_1" placeholder="Full Name" required>
                <input type="text" name="employee_id_1" placeholder="Emp ID" required>
                <input type="text" name="contact_number_1" placeholder="Contact Mobile" required>
                <input type="text" name="id_proof_1" placeholder="ID Proof (Aadhaar/PAN)" required>
            </div>

            <!-- Engineer 2 (Optional) -->
            <label style="font-size:12px; font-weight:700; color:var(--text-muted); margin-top:10px;">SECOND ENGINEER (OPTIONAL)</label>
            <div class="engineer-grid">
                <input type="text" name="engineer_name_2" placeholder="Full Name">
                <input type="text" name="employee_id_2" placeholder="Emp ID">
                <input type="text" name="contact_number_2" placeholder="Contact Mobile">
                <input type="text" name="id_proof_2" placeholder="ID Proof (Aadhaar/PAN)">
            </div>

            <!-- Engineer 3 (Optional) -->
            <label style="font-size:12px; font-weight:700; color:var(--text-muted); margin-top:10px;">THIRD ENGINEER (OPTIONAL)</label>
            <div class="engineer-grid">
                <input type="text" name="engineer_name_3" placeholder="Full Name">
                <input type="text" name="employee_id_3" placeholder="Emp ID">
                <input type="text" name="contact_number_3" placeholder="Contact Mobile">
                <input type="text" name="id_proof_3" placeholder="ID Proof (Aadhaar/PAN)">
            </div>
        </div>

        <div class="form-section">
            <div class="section-heading"><i class="fa-solid fa-envelope-open-text"></i> Recipient Email Routing</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="customer_email">Primary Customer Destination Email</label>
                    <input type="email" name="customer_email" id="customer_email" placeholder="client@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="cc_emails">Carbon Copy (CC) Emails</label>
                    <input type="text" name="cc_emails" id="cc_emails" placeholder="comma separated additional emails...">
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">
            <i class="fa-solid fa-paper-plane"></i> Dispatch Access Request Mail
        </button>
    </form>
</div>

<script>
    // Theme Switcher
    const themeToggleBtn = document.getElementById('themeToggle');
    function updateToggleIcon(theme) {
        themeToggleBtn.querySelector('i').className = theme === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    }
    updateToggleIcon(document.documentElement.getAttribute('data-theme'));

    themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('noc-theme', newTheme);
        updateToggleIcon(newTheme);
    });

    function displayStatus(message, isSuccess) {
        const banner = document.getElementById('statusAlert');
        banner.className = `status-banner ${isSuccess ? 'success' : 'error'}`;
        banner.innerHTML = isSuccess 
            ? `<i class="fa-solid fa-circle-check"></i> <span>${message}</span>`
            : `<i class="fa-solid fa-triangle-exclamation"></i> <span>${message}</span>`;
        banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // --- Dynamic Network Lookup System (Configured like dashboard.html) ---
    async function lookupNetworkCircuits() {
        const inputVal = document.getElementById('circuit_search').value.trim();
        const dropdown = document.getElementById('circuit_selection_dropdown');
        const btn = document.getElementById('searchBtn');
        
        if (!inputVal) {
            dropdown.style.display = 'none';
            alert('Please type a Circuit ID, Name, or Phone number.');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Fetching...`;

        try {
            const res = await fetch(`/api/circuit/${encodeURIComponent(inputVal)}`);
            if (!res.ok) {
                dropdown.style.display = 'none';
                throw new Error('No matching target parameters recognized inside Inventory.');
            }
            
            const records = await res.json();
            if (records.length === 1) {
                dropdown.style.display = 'none';
                populateAccessFormWithCircuit(records[0]);
                displayStatus("Customer metrics pulled successfully.", true);
                return;
            }

            dropdown.innerHTML = '';
            records.forEach((circuit) => {
                const rowItem = document.createElement('div');
                rowItem.className = 'dropdown-selection-item';
                rowItem.onmouseover = () => rowItem.style.background = 'var(--dropdown-hover)';
                rowItem.onmouseout = () => rowItem.style.background = 'transparent';
                rowItem.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold;">
                        <span style="color: var(--text-highlight); font-family: 'JetBrains Mono', monospace;">${circuit.circuit_id}</span>
                        <span style="color: var(--text-main);">${circuit.customer_name}</span>
                    </div>
                    <small style="color: var(--text-muted); display:block; margin-top:3px;">Company: ${circuit.company_name || 'N/A'} | Contact: ${circuit.phone_number || 'N/A'}</small>
                `;
                rowItem.onclick = () => {
                    populateAccessFormWithCircuit(circuit);
                    dropdown.style.display = 'none';
                    displayStatus("Selected circuit parameters applied.", true);
                };
                dropdown.appendChild(rowItem);
            });
            dropdown.style.display = 'block';
        } catch (err) {
            displayStatus("Lookup Error: " + err.message, false);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> Search Inventory`;
        }
    }

    function populateAccessFormWithCircuit(circuit) {
        document.getElementById('circuit_search').value = circuit.circuit_id || '';
        document.getElementById('company_name').value = circuit.company_name || circuit.customer_name || '';
        document.getElementById('site_location').value = circuit.address || '';
        document.getElementById('customer_email').value = circuit.customer_email || circuit.email || '';
    }

    // Hide dropdown when clicking outside
    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('circuit_selection_dropdown');
        if (dropdown && e.target.id !== 'circuit_search') {
            dropdown.style.display = 'none';
        }
    });

    document.getElementById('accessMailForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Dispatching Access Mail...`;

        const formData = new FormData(this);
        const urlEncodedData = new URLSearchParams(formData);

        try {
            const response = await fetch('/api/tools/send-access-mail', {
                method: 'POST',
                body: urlEncodedData,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            });

            const data = await response.json();

            if (response.ok) {
                displayStatus(data.message || "Access request mail delivered successfully.", true);
                this.reset();
                document.getElementById('circuit_search').value = '';
            } else {
                displayStatus("Mailer Core Error: " + (data.detail || JSON.stringify(data)), false);
            }
        } catch (error) {
            displayStatus("NOC Connection Failure: Network error during mail server sync.", false);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Dispatch Access Request Mail`;
        }
    });
</script>
</body>
</html>
