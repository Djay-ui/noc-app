<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provisioning Welcome Mailer Engine | TeleGlobal NOC</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Base Themes Properties Configurations */
        :root[data-theme="dark"] {
            --bg-body: #090d16;
            --bg-container: #111827;
            --bg-card: #1f2937;
            --border: #374151;
            --border-focus: #38bdf8;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --input-bg: #0b0f19;
            --section-bg: rgba(31, 41, 55, 0.2);
            --lookup-bg: rgba(15, 23, 42, 0.4);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.5);
            --btn-action-bg: rgba(31, 41, 55, 0.6);
            --btn-primary-text: #090d16;
            --file-box-bg: rgba(11, 15, 25, 0.6);
        }

        :root[data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-container: #ffffff;
            --bg-card: #f8fafc;
            --border: #cbd5e1;
            --border-focus: #0ea5e9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --accent-glow: rgba(14, 165, 233, 0.15);
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --input-bg: #ffffff;
            --section-bg: #f8fafc;
            --lookup-bg: #f1f5f9;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            --btn-action-bg: #f8fafc;
            --btn-primary-text: #ffffff;
            --file-box-bg: #f8fafc;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 40px 20px;
            margin: 0;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 950px;
            background: var(--bg-container);
            margin: 0 auto;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Header Bar Layout */
        .header-block {
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h2 i {
            color: var(--accent);
            background: var(--accent-glow);
            padding: 10px;
            border-radius: 10px;
        }

        .header-title p {
            margin: 6px 0 0 0;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Top Action Controls */
        .back-btn, .btn-logs {
            background: var(--btn-action-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover, .btn-logs:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .theme-toggle-btn {
            background: var(--btn-action-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        /* Database Search Lookup Panel */
        .lookup-card {
            background: var(--lookup-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 35px;
            position: relative;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .lookup-card label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .lookup-group {
            display: flex;
            gap: 12px;
        }

        .lookup-group input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .lookup-group input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Forms Layout & Section Dividers */
        .form-section {
            background: var(--section-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            transition: background-color 0.3s ease;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-heading i {
            color: var(--accent);
            font-size: 14px;
        }

        .section-heading::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input[type="text"], 
        .form-group input[type="email"], 
        .form-group input[type="date"] {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            color-scheme: dark;
        }

        :root[data-theme="light"] .form-group input[type="date"] {
            color-scheme: light;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* File Upload Components */
        .file-box {
            background: var(--file-box-bg);
            border: 1px dashed var(--border);
            padding: 16px;
            border-radius: 8px;
            transition: border-color 0.2s ease;
        }

        .file-box:hover {
            border-color: var(--accent);
        }

        .file-box input[type="file"] {
            color: var(--text-muted);
            font-size: 13px;
            width: 100%;
            cursor: pointer;
        }

        /* Interactive Standard Buttons */
        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-success {
            background: var(--success);
            color: #ffffff;
        }

        .btn-success:hover {
            background: var(--success-hover);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--btn-primary-text);
            width: 100%;
            font-size: 16px;
            padding: 16px;
            margin-top: 16px;
            font-weight: 700;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Status Feedback Banners */
        .status-banner {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .status-banner.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            display: flex;
        }

        .status-banner.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            display: flex;
        }

        .status-banner.info {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            display: flex;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            body { padding: 16px 8px; }
            .container { padding: 24px 16px; }
            .header-block { flex-direction: column; align-items: flex-start; }
            .header-right { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

<!-- Init Script to Prevent Dark/Light Flash Flickering -->
<script>
    const savedTheme = localStorage.getItem('noc-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
</script>

<div class="container">
    <!-- Top Action Deck Header Block -->
    <div class="header-block">
        <div class="header-title">
            <h2><i class="fa-solid fa-box-archive"></i> Provisioning Welcome Mailer</h2>
            <p>TeleGlobal Automation Framework</p>
        </div>
        <div class="header-right">
            <button type="button" id="themeToggle" class="theme-toggle-btn" title="Toggle System Visual Mode">
                <i class="fa-solid fa-sun"></i>
            </button>
            <a href="/api/reports/download-provisioning-welcome-logs" class="btn-logs">
                <i class="fa-solid fa-download"></i> Download CSV Logs
            </a>
            <a href="/" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard Engine
            </a>
        </div>
    </div>

    <!-- Live Status Banner Notification Space -->
    <div id="statusAlert" class="status-banner"></div>
    
    <!-- Core Inventory Lookup Panel -->
    <div class="lookup-card">
        <label for="lookup_circuit_id"><i class="fa-solid fa-magnifying-glass"></i> Automated Inventory Core Lookup</label>
        <div class="lookup-group">
            <input type="text" id="lookup_circuit_id" placeholder="Enter Circuit ID to fetch existing inventory data...">
            <button type="button" id="searchBtn" onclick="fetchCircuitData()" class="btn btn-success">
                <i class="fa-solid fa-bolt"></i> Fetch Details
            </button>
        </div>
    </div>

    <!-- Submission Form UI Matrix -->
    <form id="welcomeMailForm" enctype="multipart/form-data">
        
        <!-- Profile & Identity Section -->
        <div class="form-section">
            <div class="section-heading"><i class="fa-solid fa-id-card"></i> Client & Provisioning Profiles</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="circuit_id">Circuit ID *</label>
                    <input type="text" id="circuit_id" name="circuit_id" placeholder="e.g., TG-CIR-9921" required>
                </div>
                
                <div class="form-group">
                    <label for="customer_name">Customer Name *</label>
                    <input type="text" id="customer_name" name="customer_name" placeholder="e.g., John Doe" required>
                </div>

                <div class="form-group">
                    <label for="company_name">Company Name *</label>
                    <input type="text" id="company_name" name="company_name" placeholder="e.g., TeleGlobal Pvt Ltd" required>
                </div>

                <div class="form-group">
                    <label for="bandwidth_speed">Bandwidth Speed *</label>
                    <input type="text" id="bandwidth_speed" name="bandwidth_speed" placeholder="e.g., 100 Mbps" required>
                </div>

                <div class="form-group full-width">
                    <label for="commissioning_date">Commissioning Date *</label>
                    <input type="date" id="commissioning_date" name="commissioning_date" required>
                </div>
            </div>
        </div>

        <!-- Network Allocation Matrix Section -->
        <div class="form-section">
            <div class="section-heading"><i class="fa-solid fa-network-wired"></i> Network Allocation Parameters</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="wan_ip_details">WAN IP Details *</label>
                    <input type="text" id="wan_ip_details" name="wan_ip_details" placeholder="e.g., 192.168.1.1/30" required>
                </div>

                <div class="form-group">
                    <label for="usable_ips">Usable IPs Range *</label>
                    <input type="text" id="usable_ips" name="usable_ips" placeholder="e.g., 103.68.9.2 - 103.68.9.6" required>
                </div>

                <div class="form-group">
                    <label for="default_gateway">Default Gateway *</label>
                    <input type="text" id="default_gateway" name="default_gateway" placeholder="e.g., 103.68.9.1" required>
                </div>

                <div class="form-group">
                    <label for="subnet_mask">Subnet Mask *</label>
                    <input type="text" id="subnet_mask" name="subnet_mask" placeholder="e.g., 255.255.255.248" required>
                </div>
            </div>
        </div>

        <!-- Target Destination Emails Section -->
        <div class="form-section">
            <div class="section-heading"><i class="fa-solid fa-envelope-open-text"></i> Target Routing Boundaries</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="customer_email">Customer Destination Emails (Comma Separated) *</label>
                    <input type="text" id="customer_email" name="customer_email" placeholder="client1@company.com, client2@company.com" required>
                </div>
            </div>
        </div>

        <!-- Documents & Snapshots Upload Section -->
        <div class="form-section">
            <div class="section-heading"><i class="fa-solid fa-paperclip"></i> Provisioning Attachments</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="escalation_matrix">Upload Escalation Matrix (Strictly PDF) *</label>
                    <div class="file-box">
                        <input type="file" id="escalation_matrix" name="escalation_matrix" accept=".pdf" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="testing_snap">Upload Bandwidth Testing File *</label>
                    <div class="file-box">
                        <input type="file" id="testing_snap" name="testing_snap" accept="image/*, application/pdf" required>
                    </div>
                </div>
            </div>
        </div>

        <!-- Master Dispatch Action Fire -->
        <button type="submit" id="submitBtn" class="btn btn-primary">
            <i class="fa-solid fa-paper-plane"></i> Send Welcome Mail & Sync DB
        </button>
    </form>
</div>

<!-- Dynamic Interactivity Operations Framework -->
<script>
    // 1. Theme Configuration Switcher Script
    const themeToggleBtn = document.getElementById('themeToggle');
    
    function updateToggleIcon(theme) {
        const icon = themeToggleBtn.querySelector('i');
        if (theme === 'light') {
            icon.className = 'fa-solid fa-moon';
        } else {
            icon.className = 'fa-solid fa-sun';
        }
    }
    
    updateToggleIcon(document.documentElement.getAttribute('data-theme'));

    themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('noc-theme', newTheme);
        updateToggleIcon(newTheme);
    });

    // 2. Alert & Feedback Status Banner Display Engine
    function displayStatus(message, type = 'success') {
        const banner = document.getElementById('statusAlert');
        banner.className = `status-banner ${type}`;
        
        let icon = 'fa-circle-check';
        if (type === 'error') icon = 'fa-triangle-exclamation';
        if (type === 'info') icon = 'fa-circle-notch fa-spin';

        banner.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
        banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 3. Dynamic Inventory Circuit Data Lookup Script
    async function fetchCircuitData() {
        const searchId = document.getElementById('lookup_circuit_id').value.trim();
        const btn = document.getElementById('searchBtn');

        if (!searchId) {
            alert('Please specify an operational Circuit ID string.');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Fetching...`;

        try {
            const response = await fetch(`/api/circuit/${encodeURIComponent(searchId)}`);
            if (!response.ok) throw new Error('No matching client record located in system inventory registers.');
            
            const data = await response.json();
            const record = Array.isArray(data) ? data[0] : data;

            // Map returned record fields to UI inputs
            document.getElementById('circuit_id').value = record.circuit_id || '';
            document.getElementById('customer_name').value = record.customer_name || '';
            document.getElementById('company_name').value = record.company_name || '';
            document.getElementById('bandwidth_speed').value = record.bandwidth_speed || record.bandwidth || '';
            document.getElementById('commissioning_date').value = record.commissioning_date || '';
            document.getElementById('wan_ip_details').value = record.wan_ip_details || '';
            document.getElementById('usable_ips').value = record.usable_ips || record.usable_ip || '';
            document.getElementById('default_gateway').value = record.default_gateway || record.gateway || '';
            document.getElementById('subnet_mask').value = record.subnet_mask || record.subnet || '';
            document.getElementById('customer_email').value = record.customer_email || '';
            
            displayStatus('Profile configurations retrieved and mapped successfully.', 'success');
        } catch (err) {
            displayStatus(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Fetch Details`;
        }
    }

    // 4. Form Post Delivery Intercept Script
    document.getElementById('welcomeMailForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Transmitting Routing Packets...`;

        displayStatus('Synchronizing client tables and transmitting secure routing packets...', 'info');

        const formData = new FormData(e.target);

        try {
            const response = await fetch('/api/tools/send-welcome-mail', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.detail || 'Processing breakdown on system mail dispatch pipeline.');

            displayStatus(result.message || 'Provisioning Welcome Mail dispatched and DB synced successfully.', 'success');
            e.target.reset();
        } catch (err) {
            displayStatus(err.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Send Welcome Mail & Sync DB`;
        }
    });
</script>

</body>
</html>
