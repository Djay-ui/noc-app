<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber DB Management - Teleglobal NOC Console</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #05070f;
            --bg-container: #0b1120;
            --bg-card: #131b2e;
            --input-bg: #060a14;
            --border: #1e293b;
            --border-light: #172554;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --text-highlight: #38bdf8;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--bg-container);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 20px; font-weight: 800; color: var(--text-highlight); display: flex; align-items: center; gap: 12px; }
        header nav { display: flex; gap: 32px; }
        header nav a { color: var(--text-muted); text-decoration: none; font-weight: 700; font-size: 13.5px; }
        header nav a:hover, header nav a.active { color: var(--text-highlight); }

        .container {
            max-width: 1440px;
            margin: 40px auto;
            background: var(--bg-container);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 26px; font-weight: 800; }

        .card { background: var(--bg-card); border: 1px solid var(--border); padding: 24px; border-radius: 14px; margin-bottom: 28px; }
        .row { display: flex; gap: 20px; margin-bottom: 16px; }
        .col { flex: 1; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
        
        input, textarea {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--input-bg); color: var(--text-main); box-sizing: border-box;
        }

        .btn-save { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13.5px; }
        th { background: #0b1120; color: var(--text-muted); text-transform: uppercase; font-size: 11px; }
    </style>
</head>
<body>
<header>
    <div class="logo"><i class="fa-solid fa-network-wired"></i> Teleglobal NOC Console</div>
    <nav>
        <a href="/"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="/tickets"><i class="fa-solid fa-ticket-simple"></i> Tickets Matrix</a>
        <a href="/circuits"><i class="fa-solid fa-server"></i> Circuits Inventory</a>
        <a href="/fiber" class="active"><i class="fa-solid fa-diagram-project"></i> Fiber DB</a>
    </nav>
</header>

<div class="container">
    <div class="header-bar">
        <h1><i class="fa-solid fa-diagram-project"></i> Fiber Database Inventory</h1>
        <a href="/" class="btn-save" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>

    <!-- Fiber Entry/Edit Form -->
    <div class="card">
        <h3 style="margin-top:0; color:var(--text-highlight);">Add / Update Fiber Profile</h3>
        <input type="hidden" id="fiber_id">
        <div class="row">
            <div class="col">
                <label>Fiber Name</label>
                <input type="text" id="fiber_name" placeholder="e.g. Ring-01-Primary">
            </div>
            <div class="col">
                <label>Fiber Vendor</label>
                <input type="text" id="fiber_vendor" placeholder="e.g. Vendor Name">
            </div>
            <div class="col">
                <label>Contact Numbers</label>
                <input type="text" id="contact_numbers" placeholder="e.g. +91 9876543210">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label>Email Address</label>
                <input type="email" id="email_address" placeholder="vendor@fiber.com">
            </div>
            <div class="col">
                <label>Route Details</label>
                <input type="text" id="route_details" placeholder="Node A to Node B via Location X">
            </div>
        </div>
        <button class="btn-save" onclick="saveFiber()"><i class="fa-solid fa-floppy-disk"></i> Save Fiber Entry</button>
    </div>

    <!-- Search & Inventory Table -->
    <div class="card">
        <div class="row">
            <div class="col">
                <input type="text" id="search_query" placeholder="Search Fiber DB..." onkeyup="fetchFiberData()">
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Fiber Name</th>
                    <th>Vendor</th>
                    <th>Contact Numbers</th>
                    <th>Email Address</th>
                    <th>Route Details</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="fiber_table_body">
                <!-- Dynamic Rows -->
            </tbody>
        </table>
    </div>
</div>

<script>
    async function fetchFiberData() {
        const query = document.getElementById('search_query').value;
        const res = await fetch(`/api/fiber/all?search=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        const tbody = document.getElementById('fiber_table_body');
        tbody.innerHTML = '';
        
        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.fiber_name}</strong></td>
                <td>${item.fiber_vendor}</td>
                <td>${item.contact_numbers || '--'}</td>
                <td>${item.email_address || '--'}</td>
                <td>${item.route_details || '--'}</td>
                <td>
                    <button class="btn-save" style="padding:6px 12px; font-size:12px;" onclick='editFiber(${JSON.stringify(item)})'>Edit</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function editFiber(item) {
        document.getElementById('fiber_id').value = item.id;
        document.getElementById('fiber_name').value = item.fiber_name;
        document.getElementById('fiber_vendor').value = item.fiber_vendor;
        document.getElementById('contact_numbers').value = item.contact_numbers || '';
        document.getElementById('email_address').value = item.email_address || '';
        document.getElementById('route_details').value = item.route_details || '';
    }

    async function saveFiber() {
        const payload = {
            id: document.getElementById('fiber_id').value || null,
            fiber_name: document.getElementById('fiber_name').value,
            fiber_vendor: document.getElementById('fiber_vendor').value,
            contact_numbers: document.getElementById('contact_numbers').value,
            email_address: document.getElementById('email_address').value,
            route_details: document.getElementById('route_details').value
        };

        const res = await fetch('/api/fiber/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert('Fiber record saved successfully.');
            document.getElementById('fiber_id').value = '';
            document.getElementById('fiber_name').value = '';
            document.getElementById('fiber_vendor').value = '';
            document.getElementById('contact_numbers').value = '';
            document.getElementById('email_address').value = '';
            document.getElementById('route_details').value = '';
            fetchFiberData();
        } else {
            const err = await res.json();
            alert('Error saving record: ' + err.detail);
        }
    }

    // Initial Load
    fetchFiberData();
</script>
</body>
</html>
