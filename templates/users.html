<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Core User Management</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --card-sub-bg: #f8fafc;
            --header-th: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --card-sub-bg: #334155;
            --header-th: #334155;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; transition: background 0.3s ease, color 0.3s ease; }
        .container { max-width: 1200px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 20px; margin-bottom: 25px; }
        h1 { color: var(--text-main); margin: 0; font-size: 24px; font-weight: 700; }
        
        .btn-group { display: flex; gap: 10px; align-items: center; }
        .back-btn { background: #475569; color: white; padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; text-decoration: none; border: none; cursor: pointer; }
        .theme-toggle-btn { background: #0284c7; color: white; padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; }
        .create-btn { background: #10b981; color: white; padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; }

        .card { background: var(--card-sub-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid var(--border-color); text-align: left; color: var(--text-main); }
        th { background: var(--header-th); color: var(--text-main); }
        
        .action-btn { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .delete-btn:hover { background: #dc2626; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div>
            <h1>User Management Control Console</h1>
            <div style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Logged in as: <strong>{{ user.full_name }}</strong></div>
        </div>
        <div class="btn-group">
            <button class="theme-toggle-btn" onclick="toggleSystemTheme()">🌓 Switch Theme</button>
            <button class="create-btn" onclick="openCreateModal()">➕ Add New User</button>
            <a href="/" class="back-btn">← Back to Dashboard</a>
        </div>
    </div>

    <div class="card">
        <h3>Operational Accounts Roster</h3>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Emp ID</th>
                    <th>Username</th>
                    <th>Email ID</th>
                    <th>Full Display Name / Designation</th>
                    <th>Access Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add New User Modal -->
<div id="createUserModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div class="card" style="background: var(--card-bg); width:480px; padding:25px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.25);">
        <h3 style="margin-top:0;">Register New Operations User</h3>
        <div class="form-group"><label>Username</label><input type="text" id="create_username" required></div>
        <div class="form-group"><label>Email ID</label><input type="email" id="create_email" required></div>
        <div class="form-group"><label>Full Name / Designation</label><input type="text" id="create_full_name" required></div>
        <div class="form-group"><label>Employee ID</label><input type="text" id="create_employee_id" required></div>
        <div class="form-group">
            <label>Access Role Option</label>
            <select id="create_role">
                <option value="operator">operator</option>
                <option value="admin">admin</option>
            </select>
        </div>
        <div class="form-group"><label>Password</label><input type="text" id="create_password" required></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
            <button type="button" onclick="closeCreateModal()" style="background:#cbd5e1; border:none; padding:10px 15px; cursor:pointer;">Cancel</button>
            <button type="button" onclick="commitNewUserAccount()" style="background:#10b981; color:white; border:none; padding:10px 15px; cursor:pointer;">Register Account</button>
        </div>
    </div>
</div>

<!-- Modify/Edit User Modal -->
<div id="userModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.4); justify-content:center; align-items:center;">
    <div class="card" style="background:var(--card-bg); width:480px; padding:25px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.15);">
        <h3 style="margin-top:0;">Modify User Profile</h3>
        <input type="hidden" id="edit_user_id">
        <div class="form-group"><label>Username</label><input type="text" id="edit_username" required></div>
        <div class="form-group"><label>Email ID</label><input type="email" id="edit_email" required></div>
        <div class="form-group"><label>Full Name / Designation</label><input type="text" id="edit_full_name" required></div>
        <div class="form-group"><label>Employee ID</label><input type="text" id="edit_employee_id" required></div>
        <div class="form-group">
            <label>Access Role Option</label>
            <select id="edit_role">
                <option value="operator">operator</option>
                <option value="admin">admin</option>
            </select>
        </div>
        <div class="form-group" style="background:#fffbeb; border:1px solid #fef3c7; padding:10px; border-radius:4px;">
            <label style="color:#b45309;">Administrative Security Password Override</label>
            <input type="text" id="edit_password" placeholder="Leave blank to preserve current password">
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
            <button type="button" onclick="closeUserModal()" style="background:#cbd5e1; border:none; padding:10px 15px; cursor:pointer;">Cancel</button>
            <button type="button" onclick="commitUserChanges()" style="background:#10b981; color:white; border:none; padding:10px 15px; cursor:pointer;">Save Changes</button>
        </div>
    </div>
</div>

<script>
const activeThemeSetting = localStorage.getItem('noc-theme') || 'light';
document.documentElement.setAttribute('data-theme', activeThemeSetting);

function toggleSystemTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const targetedTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', targetedTheme);
    localStorage.setItem('noc-theme', targetedTheme);
}

function openCreateModal() {
    document.getElementById('create_username').value = '';
    document.getElementById('create_email').value = '';
    document.getElementById('create_full_name').value = '';
    document.getElementById('create_employee_id').value = '';
    document.getElementById('create_password').value = '';
    document.getElementById('createUserModal').style.display = 'flex';
}
function closeCreateModal() { document.getElementById('createUserModal').style.display = 'none'; }

async function commitNewUserAccount() {
    const payload = {
        username: document.getElementById('create_username').value.trim(),
        email_id: document.getElementById('create_email').value.trim(),
        full_name: document.getElementById('create_full_name').value.trim(),
        employee_id: document.getElementById('create_employee_id').value.trim(),
        role: document.getElementById('create_role').value,
        password: document.getElementById('create_password').value
    };
    try {
        const res = await fetch('/api/admin/users/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if(res.ok) { closeCreateModal(); loadUsersRoster(); } 
        else { const err = await res.json(); alert(`Error: ${err.detail}`); }
    } catch(err) { alert(`Transmission failure: ${err.message}`); }
}

async function loadUsersRoster() {
    try {
        const res = await fetch('/api/admin/users/all');
        const users = await res.json();
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        
        users.forEach(u => {
            tbody.innerHTML += `
            <tr>
                <td><strong>#${u.id}</strong></td>
                <td>${u.employee_id || '--'}</td>
                <td style="font-family:monospace; font-weight:bold;">${u.username}</td>
                <td>${u.email_id || '--'}</td>
                <td>${u.full_name}</td>
                <td><span style="padding:4px 8px; border-radius:12px; font-size:12px; font-weight:bold; ${u.role === 'admin' ? 'background:#dbeafe; color:#1e40af;' : 'background:#e2e8f0; color:#334155;'}">${u.role.toUpperCase()}</span></td>
                <td>
                    <button type="button" class="action-btn" onclick="openUserModal(${u.id}, '${u.username}', '${u.email_id || ''}', '${u.full_name}', '${u.employee_id || ''}', '${u.role}')">Modify</button>
                    <button type="button" class="delete-btn" onclick="triggerAccountDeletion(${u.id}, '${u.username}')">Delete</button>
                </td>
            </tr>`;
        });
    } catch(e) { console.error("Error generating user roster table: ", e); }
}

function openUserModal(id, username, email, fullName, employeeId, role) {
    document.getElementById('edit_user_id').value = id;
    document.getElementById('edit_username').value = username;
    document.getElementById('edit_email').value = email;
    document.getElementById('edit_full_name').value = fullName;
    document.getElementById('edit_employee_id').value = employeeId;
    document.getElementById('edit_role').value = role;
    document.getElementById('edit_password').value = ''; 
    document.getElementById('userModal').style.display = 'flex';
}
function closeUserModal() { document.getElementById('userModal').style.display = 'none'; }

async function commitUserChanges() {
    const payload = {
        user_id: parseInt(document.getElementById('edit_user_id').value),
        username: document.getElementById('edit_username').value,
        email_id: document.getElementById('edit_email').value,
        full_name: document.getElementById('edit_full_name').value,
        employee_id: document.getElementById('edit_employee_id').value,
        role: document.getElementById('edit_role').value,
        password: document.getElementById('edit_password').value
    };
    try {
        const res = await fetch('/api/admin/users/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if(res.ok) { closeUserModal(); loadUsersRoster(); } 
        else { const data = await res.json(); alert(`Error: ${data.detail}`); }
    } catch(err) { alert(`Execution error: ${err.message}`); }
}

async function triggerAccountDeletion(id, username) {
    if(!confirm(`WARNING: Are you sure you want to completely delete user "${username}"?`)) return;
    if(!confirm(`FINAL CONFIRMATION: This action is permanent. Delete account entry #${id} permanently?`)) return;
    
    try {
        const res = await fetch(`/api/admin/users/delete/${id}`, { method: 'POST' });
        if(res.ok) { loadUsersRoster(); } 
        else { const data = await res.json(); alert(`Error: ${data.detail}`); }
    } catch(err) { alert(`Delete transmission dropped: ${err.message}`); }
}

window.addEventListener('DOMContentLoaded', loadUsersRoster);
</script>
</body>
</html>
