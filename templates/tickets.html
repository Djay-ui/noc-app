<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleglobal NOC - Tickets Portal</title>
    <style>
        :root {
            --bg-primary: #121824;
            --bg-secondary: #1a2333;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e3c54;
            
            /* Priority Colors */
            --p1-critical: #ef4444;
            --p2-high: #f97316;
            --p3-medium: #eab308;
            --p4-low: #3b82f6;

            /* Status & SLA Colors */
            --status-open: #10b981;
            --status-closed: #6b7280;
            --sla-breached-bg: rgba(239, 68, 68, 0.15);
            --sla-compliant-bg: rgba(16, 185, 129, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Top Navigation Header */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--text-main);
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 0.25rem;
        }

        /* Main Workspace Section */
        main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title h1 {
            font-size: 1.75rem;
            font-weight: 600;
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Responsive Operational Data Table */
        .table-container {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .noc-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .noc-table th {
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 1rem;
            letter-spacing: 0.05em;
        }

        .noc-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .noc-table tr:hover {
            background-color: rgba(255, 255, 255, 0.01);
        }

        /* Styling Badges & Markers */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Priority Colors Mapping */
        .p-p1 { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid var(--p1-critical); }
        .p-p2 { background-color: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid var(--p2-high); }
        .p-p3 { background-color: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid var(--p3-medium); }
        .p-p4 { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid var(--p4-low); }

        /* SLA Warning Conditions */
        .sla-breached {
            background-color: var(--sla-breached-bg);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            font-weight: 600;
        }

        .sla-compliant {
            background-color: var(--sla-compliant-bg);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        /* Core Status Indicators */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 500;
        }

        .status-pill::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-open::before { background-color: var(--status-open); }
        .status-closed::before { background-color: var(--status-closed); }

        .btn-refresh {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-refresh:hover {
            background-color: #0369a1;
        }

        .text-center { text-align: center; }
        .empty-state { color: var(--text-muted); padding: 3rem 1rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🌐 Teleglobal NOC
        </div>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/tickets" class="active">Tickets</a>
            <a href="/circuits">Circuits Inventory</a>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <div class="page-title">
                <h1>Live Operations Tickets</h1>
                <p>Real-time telemetry and network incident response queue.</p>
            </div>
            <div>
                <button class="btn-refresh" onclick="fetchActiveTickets()">🔄 Refresh Queue</button>
            </div>
        </div>

        <div class="table-container">
            <table class="noc-table">
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Circuit ID</th>
                        <th>Issue Category</th>
                        <th>Priority</th>
                        <th>SLA Status</th>
                        <th>Status</th>
                        <th>Assigned Team</th>
                    </tr>
                </thead>
                <tbody id="tickets-table-body">
                    <tr>
                        <td colspan="7" class="text-center empty-state">Inverting database telemetry connection...</td>
                    </tr>
                </tbody>
                <tfoot></tfoot>
            </table>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchActiveTickets();
            setInterval(fetchActiveTickets, 60000); // Auto-refresh every 60 seconds
        });

        async function fetchActiveTickets() {
            const tableBody = document.getElementById("tickets-table-body");
            
            try {
                // ⚠️ FIX RULE APPLIED BELOW: Updated route target to match working backend logs
                const response = await fetch("/api/tickets/recent?limit=100");
                if (!response.ok) throw new Error("Network status validation failed.");
                
                const ticketsList = await response.json();
                
                if (!ticketsList || ticketsList.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="7" class="text-center empty-state">✅ No active ticket incidents listed in the queue.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = ""; // Clear loading screen text
                
                ticketsList.forEach(ticket => {
                    // Fallback configuration filters to prevent layout breaks on missing parameters
                    const priorityValue = ticket.priority ? ticket.priority.toUpperCase() : 'P3';
                    const isBreached = ticket.is_sla_breached || false;
                    const statusText = ticket.status ? ticket.status.toUpperCase() : 'OPEN';
                    const statusClass = statusText === 'CLOSED' ? 'status-closed' : 'status-open';

                    const priorityClass = `p-${priorityValue.toLowerCase()}`;
                    const slaBadge = isBreached 
                        ? `<span class="badge sla-breached">⚠️ BREACHED</span>` 
                        : `<span class="badge sla-compliant">SLA Compliant</span>`;

                    tableBody.innerHTML += `
                        <tr>
                            <td>#${ticket.ticket_id || ticket.id}</td>
                            <td><strong>${ticket.circuit_id || 'N/A'}</strong></td>
                            <td>${ticket.issue_category || 'General Alert'}</td>
                            <td><span class="badge ${priorityClass}">${priorityValue}</span></td>
                            <td>${slaBadge}</td>
                            <td><span class="status-pill ${statusClass}">${statusText}</span></td>
                            <td>${ticket.assigned_team || 'Unassigned'}</td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Dashboard Render Interruption:", error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center empty-state" style="color: #ef4444;">
                            ❌ Failed to communicate with FastAPI network engine. Verify backend paths.
                        </td>
                    </tr>
                `;
            }
        }
    </script>
</body>
</html>
